      </g>
      <g fill="#fff" opacity=".5">
        <rect x="30" y="96" width="4" height="4"/>
        <rect x="40" y="90" width="3" height="3"/>
        <rect x="44" y="100" width="3" height="3"/>
      </g>
      <!-- 钻石点 -->
      <rect x="22" y="94" width="6" height="6" fill="#65dbe8"/>
