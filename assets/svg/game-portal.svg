<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
<style>
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-13px)}}
@keyframes spark{0%,100%{opacity:.2}50%{opacity:1}}
.bob{transform-box:view-box}
.bob-a{animation:bob 7s ease-in-out infinite}
.bob-b{animation:bob 5.6s ease-in-out infinite;animation-delay:-1.6s}
.bob-c{animation:bob 6.4s ease-in-out infinite;animation-delay:-3.2s}
.bob-d{animation:bob 6.8s ease-in-out infinite;animation-delay:-4.4s}
.sparks rect{animation:spark 3.2s steps(2,jump-none) infinite}
.sparks rect:nth-child(2){animation-delay:-.7s}
.sparks rect:nth-child(3){animation-delay:-1.4s}
.sparks rect:nth-child(4){animation-delay:-2.1s}
.sparks--gold rect:nth-child(2){animation-delay:-1s}
.sparks--gold rect:nth-child(3){animation-delay:-2.4s}
.bar-live{animation:spark 2.6s steps(2,jump-none) infinite}
</style>
<defs>
      <linearGradient id="g-grass-top" x1="0" y1="0" x2=".4" y2="1">
        <stop offset="0" stop-color="#8ae66c"/><stop offset="1" stop-color="#57ad3f"/>
      </linearGradient>
      <linearGradient id="g-dirt-left" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#6d4830"/><stop offset="1" stop-color="#523524"/>
      </linearGradient>
      <linearGradient id="g-dirt-right" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#8a5c3b"/><stop offset="1" stop-color="#68432b"/>
      </linearGradient>
      <linearGradient id="g-stone-top" x1="0" y1="0" x2=".4" y2="1">
        <stop offset="0" stop-color="#a3b0c2"/><stop offset="1" stop-color="#76839a"/>
      </linearGradient>
      <linearGradient id="g-stone-left" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#4d586b"/><stop offset="1" stop-color="#3b4554"/>
      </linearGradient>
      <linearGradient id="g-stone-right" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#626e82"/><stop offset="1" stop-color="#4a5568"/>
      </linearGradient>
      <linearGradient id="g-goldblock-top" x1="0" y1="0" x2=".4" y2="1">
      <stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#f2c14e"/>
    </linearGradient>
    <linearGradient id="g-goldblock-left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9962f"/><stop offset="1" stop-color="#a87a22"/>
    </linearGradient>
    <linearGradient id="g-goldblock-right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8b53f"/><stop offset="1" stop-color="#c08c28"/>
    </linearGradient>
    <linearGradient id="g-portal" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#c084fc"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#d946ef"/>
      </linearGradient>
    </defs>
<g>
      <g transform="translate(104 14)">
        <rect x="0" y="0" width="112" height="150" fill="#2a1d3e"/>
        <rect x="8" y="8" width="96" height="134" fill="#120c1e"/>
        <rect x="16" y="16" width="80" height="118" fill="url(#g-portal)"/>
        <g fill="#d8a6ff" opacity=".5">
          <rect x="28" y="34" width="10" height="10"/>
          <rect x="58" y="54" width="14" height="14"/>
          <rect x="40" y="86" width="10" height="10"/>
          <rect x="68" y="108" width="8" height="8"/>
        </g>
        <g fill="#ffffff" opacity=".35">
          <rect x="44" y="46" width="6" height="6"/>
          <rect x="70" y="30" width="4" height="4"/>
          <rect x="32" y="72" width="5" height="5"/>
          <rect x="60" y="122" width="5" height="5"/>
        </g>
        <rect x="0" y="0" width="112" height="6" fill="#3d2c58"/>
        <rect x="0" y="0" width="6" height="150" fill="#3d2c58"/>
        <rect x="8" y="8" width="4" height="134" fill="#4a3768"/>
        <rect x="104" y="8" width="4" height="134" fill="#241a35"/>
      </g>
      <g fill="#c084fc">
        <rect x="70" y="40" width="4" height="4"/>
        <rect x="238" y="62" width="5" height="5"/>
        <rect x="252" y="130" width="4" height="4"/>
        <rect x="84" y="132" width="3" height="3"/>
      </g>
      <rect x="250" y="26" width="12" height="12" fill="#2a1d3e"/>
      <rect x="253" y="29" width="6" height="6" fill="#c084fc"/>
      <!-- 门框黑曜石纹理 -->
      <g fill="#191026">
        <rect x="104" y="40" width="4" height="14"/>
        <rect x="212" y="72" width="4" height="14"/>
        <rect x="132" y="158" width="18" height="6"/>
        <rect x="170" y="158" width="14" height="6"/>
        <rect x="140" y="14" width="16" height="4"/>
      </g>
      <!-- 门内飘落粒子 -->
      <g fill="#e9c8ff" opacity=".6">
        <rect x="128" y="34" width="4" height="4"/>
        <rect x="176" y="108" width="4" height="4"/>
        <rect x="136" y="120" width="3" height="3"/>
        <rect x="188" y="60" width="3" height="3"/>
      </g>
      <!-- 底部紫光池 -->
      <rect x="88" y="164" width="144" height="8" fill="#3a1f63" opacity=".55"/>
      <rect x="120" y="164" width="80" height="8" fill="#8b5cf6" opacity=".4"/>
    </g>
</svg>
