<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-theme-pref="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>白名单审核后台 · LongerMC</title>
  <meta name="robots" content="noindex,nofollow" />
  <meta name="author" content="LongerMC" />
  <meta name="theme-color" content="#171615" />

  <link rel="icon" href="/icon.jpg" type="image/jpeg" />
  <link rel="apple-touch-icon" href="/icon.jpg" />

  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/whitelist.css" />

  <script>
    /* 主题初始化：首次访问默认深色；可选 浅色 / 跟随系统 / 深色
       在首次绘制前完成，避免闪屏；实际外观写入 data-theme，用户偏好写入 data-theme-pref */
    document.documentElement.classList.add('js');
    (function () {
      var root = document.documentElement, pref = 'dark';
      try {
        var saved = localStorage.getItem('lmc-theme');
        if (saved === 'light' || saved === 'system' || saved === 'dark') pref = saved;
      } catch (e) {}
      var dark = pref === 'dark' || (pref === 'system' &&
        window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      root.setAttribute('data-theme', dark ? 'dark' : 'light');
      root.setAttribute('data-theme-pref', pref);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', dark ? '#171615' : '#f4efe9');
    })();
  </script>
</head>
<body data-page="admin">
  <script src="/js/icons.js"></script>
  <div id="nav-root"></div>

  <main id="main" class="wl-admin">
    <div class="wl-wrap">
      <header class="wl-head">
        <div class="wl-kicker">ADMIN · WHITELIST</div>
        <h1 class="wl-title">白名单<em>审核后台</em></h1>
        <p class="wl-sub">
          本页由 Cloudflare Access 保护。系统只记录审核结果，不会自动修改 Minecraft 服务器的 whitelist.json，
          所有原版白名单操作需你手动执行。
        </p>
      </header>

      <div id="adminAlert" class="wl-alert"></div>

      <div class="wl-admin-bar">
        <span class="wl-actor">当前管理员：<b id="adminActor">检测中…</b></span>
        <div class="wl-actions">
          <button class="wl-btn" id="btnRefresh" type="button">刷新</button>
          <a class="wl-btn wl-btn--ghost" href="/whitelist/" target="_blank" rel="noopener">打开白名单前台</a>
        </div>
      </div>

      <nav class="wl-tabs" id="adminTabs" aria-label="审核分类"></nav>

      <div class="wl-card" id="adminPanel" style="padding:0;border:0;background:transparent;box-shadow:none;"></div>
    </div>
  </main>

  <div id="footer-root"></div>

  <div id="modalRoot"></div>

  <script src="/js/nav.js" defer></script>
  <script src="/js/footer.js" defer></script>
  <script src="/js/main.js" defer></script>
  <script src="/js/theme.js" defer></script>
  <script src="/js/admin-whitelist.js" defer></script>
</body>
</html>
