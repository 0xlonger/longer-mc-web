<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>404 · 页面没有找到 | LongerMC</title>
  <meta name="description" content="你访问的页面不存在。返回 LongerMC 首页，或直接加入服务器 play.mc.longer.xin。" />
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#0a0d12" />

  <link rel="icon" href="/icon.jpg" type="image/jpeg" />
  <link rel="apple-touch-icon" href="/icon.jpg" />

  <link rel="preload" href="/assets/fonts/press-start-2p.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/css/style.css" />
  <script>document.documentElement.classList.add('js');</script>
</head>
<body class="page-404">

  <a class="skip-link" href="#main">跳到主要内容</a>

  <div class="scroll-progress" aria-hidden="true"><span id="scrollProgress"></span></div>

  

  <!-- 导航栏：由 js/nav.js 从 /partials/nav.html 统一载入（与首页同一份） -->
  <div id="nav-root"></div>


  <span id="top"></span>

  <main id="main" class="err-wrap">
    <span class="err-glow" aria-hidden="true"></span>

    <div class="err-code-row">
      <img class="err-mini-cube err-mini-cube--left" src="/assets/svg/mini-cube-grass.svg" alt="" aria-hidden="true">

      <div class="err-code" aria-hidden="true">404</div>

      <img class="err-mini-cube err-mini-cube--right" src="/assets/svg/mini-cube-diamond.svg" alt="" aria-hidden="true">
    </div>

    <div class="err-kicker"><span class="dot" aria-hidden="true"></span>CHUNK NOT FOUND</div>

    <h1 class="err-title">这个区块<span class="hl">不存在</span></h1>

    <p class="err-desc">
      您的页面掉出了这个世界<br />
      也可能是我们根本没有这个世界
    </p>

    <div class="err-actions">
      <a class="btn" href="index.html">
        <svg class="icon" aria-hidden="true"><use href="/assets/svg/icons.svg#i-home"/></svg>
        返回首页
      </a>
      <a class="btn btn-ghost" href="index.html#join">
        <svg class="icon" aria-hidden="true"><use href="/assets/svg/icons.svg#i-door"/></svg>
        如何加入服务器
      </a>
      <button class="btn btn-ghost" type="button"
              data-copy="play.mc.longer.xin"
              data-copy-done="已复制"
              data-copy-fail="请手动复制">
        <svg class="icon" aria-hidden="true"><use href="/assets/svg/icons.svg#i-copy"/></svg>
        <span data-copy-label>复制服务器地址</span>
      </button>
    </div>

    <p class="err-ip">play.mc.longer.xin</p>
  </main>

  <!-- 页脚：由 js/footer.js 从 /partials/footer.html 统一载入（与首页同一份） -->
  <div id="footer-root"></div>

  <div class="sr-only" id="copyAnnouncer" aria-live="polite"></div>

  <script src="js/nav.js" defer></script>
  <script src="js/footer.js" defer></script>
  <script src="js/main.js" defer></script>
  <script src="js/status.js" defer></script>
</body>
</html>
